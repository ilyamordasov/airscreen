name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'yaos/**'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'yaos/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: yaos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCast-TV-debug-${{ github.run_number }}
          path: yaos/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

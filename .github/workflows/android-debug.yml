name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'yaos/**'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'yaos/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: yaos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned VLESS core
        run: bash ./fetch-libbox.sh
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Measure OTA APK
        if: success()
        run: stat -c '%n %s bytes' app/build/outputs/apk/debug/FreeCast-TV-*.apk
      - name: Check release APK fits installed OTA loader
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/ota-size.jks" -storepass changeit -keypass changeit \
            -alias ota-size -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Temporary CI size check' >/dev/null 2>&1
          SIGNING_KEYSTORE="$RUNNER_TEMP/ota-size.jks" SIGNING_KEYSTORE_PASSWORD=changeit \
            SIGNING_KEY_ALIAS=ota-size SIGNING_KEY_PASSWORD=changeit \
            ./gradlew assembleRelease -PversionName=0.3.2 -PversionCode=302
          apk=app/build/outputs/apk/release/FreeCast-TV-0.3.2.apk
          bytes=$(stat -c '%s' "$apk")
          echo "Release APK: $bytes bytes; old OTA limit: 104857600 bytes"
          test "$bytes" -le 104857600
          rm -f "$RUNNER_TEMP/ota-size.jks"
      - name: Show all lint errors
        if: failure()
        run: |
          report=app/build/reports/lint-results-debug.txt
          if [[ -f "$report" ]]; then
            grep -n -A 2 'Error:' "$report" | head -100 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCast-TV-debug-${{ github.run_number }}
          path: yaos/app/build/outputs/apk/debug/FreeCast-TV-*.apk
          if-no-files-found: error
          retention-days: 14

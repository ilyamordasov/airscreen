name: Android signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: yaos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Tag must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( major > 2000 || minor > 999 || patch > 999 )); then
            echo 'Version exceeds versionCode range' >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo 'Invalid Android versionCode' >&2
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 secret}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Missing SIGNING_KEYSTORE_PASSWORD secret}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/freecast-release.jks"
          chmod 600 "$RUNNER_TEMP/freecast-release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/freecast-release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease lintRelease -PversionName='${{ steps.version.outputs.name }}' -PversionCode='${{ steps.version.outputs.code }}'
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/FreeCast-TV-${{ steps.version.outputs.name }}.apk"
          test -s "$apk"
          actual_cert=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            docs/verification/apk-signature.txt)
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo 'Signing certificate differs from the original FreeCast TV release' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -1
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/FreeCast-TV-${{ steps.version.outputs.name }}.apk" \
            --verify-tag --title "FreeCast TV ${{ steps.version.outputs.name }}" \
            --notes "Обновление FreeCast TV для Android TV и YaOS."
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/freecast-release.jks"
